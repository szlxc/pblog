# ============================================================
# PBLOG 静态站点 Nginx 配置
# 前台:  /        → web/dist
# 管理端: /admin  → admin/dist
# API:   /api、/uploads → 反代到后端容器
# ============================================================

upstream pblog_api {
    server server:8080;
    keepalive 32;
}

# Gzip
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css application/json application/javascript
           application/xml image/svg+xml text/javascript;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;   # 与后端视频上传上限(40MB)匹配

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- SSE 实时推送（必须关闭缓冲，否则消息会被攒着不发） ----------
    location /api/chat/stream {
        proxy_pass http://pblog_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # ---------- API 反代 ----------
    location /api/ {
        proxy_pass http://pblog_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # ---------- 上传文件 ----------
    # 必须用 ^~ ：否则下面的静态资源正则 location（~* \.png$ 等）
    # 会优先匹配 /uploads/xxx.png，导致去本地目录找文件 → 404
    location ^~ /uploads/ {
        proxy_pass http://pblog_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ---------- 管理端 ----------
    # 管理端：SPA，所有子路径回落到 /admin/index.html
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }
    # 访问 /admin 时补上结尾斜杠，否则相对资源路径会错位
    location = /admin {
        return 301 /admin/;
    }

    # 管理端构建产物（base=/admin/），命中即可长缓存
    location /admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 前台静态资源 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 静态资源：只处理本地构建产物，/uploads/ 已在上面用 ^~ 拦截
    location ~* ^/(?!uploads/).*\.(?:css|js|woff2?|ttf|otf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ---------- 前台 SPA 路由 ----------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 不允许访问隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
    }
}
