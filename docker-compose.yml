# ============================================================
# PBLOG 一键部署（MySQL + 后端 + Nginx 静态站点）
#
# 1. 复制 .env.example 为 .env 并修改密码
# 2. docker compose up -d --build
# 3. 首次启动后执行数据库迁移与种子：
#    docker compose exec server npm run migrate
#    docker compose exec server npm run seed
# 4. 访问 http://你的服务器IP/         前台
#   访问 http://你的服务器IP/admin/   管理端
# ============================================================

services:
  db:
    image: mysql:8.0
    container_name: pblog-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --default-time-zone=+08:00
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${PBLOG_DB_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: ${PBLOG_DB_NAME:-pblog}
      MYSQL_USER: ${PBLOG_DB_USER:-pblog}
      MYSQL_PASSWORD: ${PBLOG_DB_PASSWORD:-pblog_pass}
    volumes:
      - db_data:/var/lib/mysql
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${PBLOG_DB_ROOT_PASSWORD:-root_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [pblog]

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: pblog-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      PBLOG_HOST: 0.0.0.0
      PBLOG_PORT: 8080
      PBLOG_PUBLIC_URL: ${PBLOG_PUBLIC_URL:-http://localhost}
      PBLOG_FRONTEND_URL: ${PBLOG_FRONTEND_URL:-http://localhost}
      PBLOG_ADMIN_URL: ${PBLOG_ADMIN_URL:-http://localhost/admin}
      PBLOG_JWT_SECRET: ${PBLOG_JWT_SECRET:-change_me_in_production}
      PBLOG_DB_HOST: db
      PBLOG_DB_PORT: 3306
      PBLOG_DB_USER: ${PBLOG_DB_USER:-pblog}
      PBLOG_DB_PASSWORD: ${PBLOG_DB_PASSWORD:-pblog_pass}
      PBLOG_DB_NAME: ${PBLOG_DB_NAME:-pblog}
      PBLOG_ADMIN_USER: ${PBLOG_ADMIN_USER:-admin}
      PBLOG_ADMIN_PASSWORD: ${PBLOG_ADMIN_PASSWORD:-CHANGE_ME_BEFORE_DEPLOY}
      PBLOG_UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    networks: [pblog]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        PBLOG_PUBLIC_URL: ${PBLOG_PUBLIC_URL:-http://localhost}
    container_name: pblog-web
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "${PBLOG_HTTP_PORT:-80}:80"
    networks: [pblog]

volumes:
  db_data:
  uploads:

networks:
  pblog:
    driver: bridge
